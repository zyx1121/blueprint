name: carrel
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun build --compile server/main.ts --outfile blueprint
      - run: mv out web && tar czf "$RUNNER_TEMP/app.tar.gz" blueprint web
      - uses: NYCU-WinLab/carrel-deploy@v1
        with:
          tenant: zyx1121
          app: blueprint
          artifact: ${{ runner.temp }}/app.tar.gz
